<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Lighthouse Index | Home</title>
  <link rel="stylesheet" href="main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">

    <header>
      <h1>Anime Lighthouse Index</h1>

      <div class="subtitle-bar">
        <div class="subtitle">
          <span id="view-recent" class="view-link"><a href="/" style="text-decoration:none;color:grey;">Recent</a></span>
          •
          <span id="view-index" class="view-link active">Index</span>
        </div>

        <button id="menu-toggle" class="burger">☰</button>
      </div>

      <!-- hidden panel -->
      <div id="filter-panel" class="filter-panel hidden">

        <!-- Search -->
        <div class="panel-section">
          <input type="text" id="search" class="search-input" placeholder="Search..." />
        </div>

        <!-- Options -->
        <div class="panel-section">
          <div class="panel-header">Options</div>

          <label class="control">
            <span>Title language</span>
            <select id="title-mode">
              <option value="title_en">English</option>
              <option value="title_r">Romaji</option>
              <option value="title_jp">日本語</option>
            </select>
          </label>

          <label class="control">
            <span>Sort order</span>

            <select id="sort-mode">
              <option value="newest">Most recent first</option>
              <option value="oldest">Oldest first</option>
              <option value="az">A–Z</option>
              <option value="za">Z–A</option>
            </select>
          </label>
        </div>

        <!-- Filters  -->
        <div class="panel-section">
          <div class="panel-header">Filters</div>

          <!-- Media type -->
          <label class="control">
            <div class="checkbox-group">
              <label class="checkbox">
                <input type="checkbox" id="filter-anime" checked />
                <span>Anime</span>
              </label>

              <label class="checkbox">
                <input type="checkbox" id="filter-manga" checked />
                <span>Manga</span>
              </label>
            </div>
          </label>

          <!-- Real only -->
          <label class="checkbox">
            <input type="checkbox" id="real-only" />
            <span>Real lighthouses only</span>
          </label>

        </div>

    </header>

    <main id="app"></main>

  </div>

  <script type="module" src="index.js"></script>
</body>

</html>

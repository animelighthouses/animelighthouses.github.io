<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit a lighthouse</title>
    <link rel="stylesheet" href="main.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.addEventListener("DOMContentLoaded", async () => {

                const supabase = window.supabase.createClient(
                    "https://ogningqqgxhwkmozikmu.supabase.co",
                    "sb_publishable_Q9SEFHhKlsG05lL4dmrSqw_hwbvmEAB"
                )

                await supabase.auth.exchangeCodeForSession(window.location.href)

                const { data } = await supabase.auth.getSession()

                const form = document.getElementById("lighthouseForm")

                if (data.session) {
                    form.style.opacity = 1
                    form.style.pointerEvents = "auto"
                } else {
                    form.style.opacity = 0.5
                    form.style.pointerEvents = "none"
                }

            })

            const supabase = window.supabase.createClient(
                "https://ogningqqgxhwkmozikmu.supabase.co",
                "sb_publishable_Q9SEFHhKlsG05lL4dmrSqw_hwbvmEAB"
            )

            const loginBtn = document.getElementById("loginBtn")
            const form = document.getElementById("lighthouseForm")
            const resultDiv = document.getElementById("result")

            // -------------------------
            // AUTH
            // -------------------------

            async function signInWithGithub() {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: "github",
                    options: {
                        redirectTo: window.location.href
                    }
                })

                if (error) console.error(error)
            }

            loginBtn.addEventListener("click", signInWithGithub)

            async function checkSession() {
                await supabase.auth.exchangeCodeForSession(window.location.href)

                const { data } = await supabase.auth.getSession()

                if (data.session) {
                    enableForm()
                } else {
                    disableForm()
                }
            }

            checkSession()

            function disableForm() {
                form.style.opacity = 0.5
                form.style.pointerEvents = "none"
            }

            function enableForm() {
                form.style.opacity = 1
                form.style.pointerEvents = "auto"
            }

            // -------------------------
            // FORM SUBMIT (placeholder for now)
            // -------------------------

            form.addEventListener("submit", async (e) => {
                e.preventDefault()

                resultDiv.style.display = "none"
                resultDiv.className = "result"

                const formData = Object.fromEntries(new FormData(form))

                // clean empty strings → null (important for DB cleanliness)
                Object.keys(formData).forEach(key => {
                    if (formData[key] === "") formData[key] = null
                })

                const { data, error } = await supabase
                    .from("lighthouses")
                    .insert([formData])
                    .select("id")
                    .single()

                if (error) {
                    resultDiv.textContent = "Error: " + error.message
                    resultDiv.classList.add("error")
                    resultDiv.style.display = "block"
                    return
                }

                const id = data.id

                resultDiv.textContent = `Lighthouse added successfully. ID: ${id}`
                resultDiv.classList.add("success")
                resultDiv.style.display = "block"

                form.reset()
            })

        })
    </script>

    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 0rem;
            margin: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            display: flex;

        }

        label {
            font-size: 1rem;
            margin-bottom: 0.2rem;
            margin-top: 0.5rem;
            color: #555;
        }

        input,
        textarea,
        select {
            padding: 0.5rem;
            min-height: 3rem;
            font-size: 1rem;
            border: solid;
            border-width: 0.1rem;
        }

        textarea {
            min-height: 6rem;
            resize: vertical;
        }

        .section {
            margin-top: 0rem;
            padding-top: 1.5rem;
        }

        .submission-form-title {
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 0rem;
            padding-top: 1rem;
        }

        button {
            padding: 0.6rem;
            font-size: 1rem;
            cursor: pointer;
        }

        .result {
            margin-top: 1.5rem;
            padding: 0.75rem;
            font-size: 0.95rem;
            border: 0.1rem solid #ccc;
            background: #f9f9f9;
            display: none;
        }

        .result.success {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .result.error {
            border-color: #f44336;
            background: #ffebee;
        }

        .loginbutton {
            font-size: 0.5rem;
        }
    </style>
</head>

                            <option>Kumamoto</option>
                            <option>Kyoto</option>
                            <option>Mie</option>
                            <option>Miyagi</option>
                            <option>Miyazaki</option>
                            <option>Nagasaki</option>
                            <option>Nagano</option>

                            <option>Yamagata</option>
                            <option>Yamaguchi</option>
                            <option>Yamanashi</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>Notes</label>
                        <div class="field">
                            <textarea name="notes_l"></textarea>
                        </div>
                    </div>
                </div>

                <div style="margin:2rem 0rem;">
                    <button type="submit">Add Lighthouse</button>
                </div>

                <div id="result" class="result"></div>

            </form>
    </div>
</body>

</html>

<!DOCTYPE html>
<!-- Submit a lighthouse reference. Entry: /js/pages/submit-lighthouse.js -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit a lighthouse</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/submit.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Submit</h1>
            <!-- include: partials/submit-subtitle.html -->
            <div class="subtitle-bar">
              <div class="subtitle">
                <span id="view-sighting" class="view-link"><a class="view-anchor" href="/submit-admin">Sighting</a></span>
                •
                <span id="view-lighthouse" class="view-link"><a class="view-anchor" href="/submitl">Lighthouse</a></span>
                |
                <span class="view-link"><a class="view-anchor" href="/">Home</a></span>
              </div>

              <button id="loginBtn">Login</button>
            </div>
            <p id="submitAdminNotice" class="submit-auth-notice" hidden>
              Only administrators may submit. Please sign in with an authorized account to continue.
            </p>
            <!-- /include -->
            <form id="lighthouseForm">

                <div class="section">
                    <div class="field">
                        <label>English name *</label>
                        <input name="name_en" required />
                    </div>

                    <div class="field">
                        <label>Japanese name</label>
                        <input name="name_jp" />
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>Wikipedia (EN)</label>
                        <input name="wiki_en" type="url" />
                    </div>

                    <div class="field">
                        <label>Wikipedia (JP)</label>
                        <input name="wiki_jp" type="url" />
                    </div>

                    <div class="field">
                        <label>Google Maps</label>
                        <input name="google_maps_link" type="url" />
                    </div>

                    <div class="section">

                        <div class="field">
                            <label>Lighthouse-JAPAN</label>
                            <input name="lighthouse_japan_link" type="url" />
                        </div>
                    </div>
                    <div class="field">
                        <label>Prefecture</label>
                        <select name="prefecture">
                            <option value="">-- Select prefecture --</option>
                            <option>Aichi</option>
                            <option>Akita</option>
                            <option>Aomori</option>
                            <option>Chiba</option>
                            <option>Ehime</option>
                            <option>Fukui</option>
                            <option>Fukuoka</option>
                            <option>Fukushima</option>
                            <option>Gifu</option>
                            <option>Gunma</option>
                            <option>Hiroshima</option>
                            <option>Hokkaido</option>
                            <option>Hyogo</option>
                            <option>Ibaraki</option>
                            <option>Ishikawa</option>
                            <option>Iwate</option>
                            <option>Kagawa</option>
                            <option>Kagoshima</option>
                            <option>Kanagawa</option>
                            <option>Kochi</option>
                            <option>Kumamoto</option>
                            <option>Kyoto</option>
                            <option>Mie</option>
                            <option>Miyagi</option>
                            <option>Miyazaki</option>
                            <option>Nagasaki</option>
                            <option>Nagano</option>
                            <option>Niigata</option>
                            <option>Oita</option>
                            <option>Okayama</option>
                            <option>Okinawa</option>
                            <option>Osaka</option>
                            <option>Saga</option>
                            <option>Saitama</option>
                            <option>Shiga</option>
                            <option>Shimane</option>
                            <option>Shizuoka</option>
                            <option>Tochigi</option>
                            <option>Tokushima</option>
                            <option>Tokyo</option>
                            <option>Tottori</option>
                            <option>Toyama</option>
                            <option>Wakayama</option>
                            <option>Yamagata</option>
                            <option>Yamaguchi</option>
                            <option>Yamanashi</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>Notes</label>
                        <div class="field">
                            <textarea name="notes_l"></textarea>
                        </div>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit">Add Lighthouse</button>
                </div>

                <div id="result" class="result"></div>

            </form>
    </div>
    <script type="module" src="/js/pages/submit-lighthouse.js"></script>
</body>

</html>

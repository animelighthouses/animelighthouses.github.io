<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit a lighthouse</title>
    <link rel="stylesheet" href="main.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://ogningqqgxhwkmozikmu.supabase.co",
    "sb_publishable_Q9SEFHhKlsG05lL4dmrSqw_hwbvmEAB"
  )

  async function signInWithGithub() {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "github"
    })

    if (error) console.error(error)
  }

  document.getElementById("loginBtn")
    .addEventListener("click", signInWithGithub)

  function disableForm() {
    document.getElementById("lighthouseForm").style.opacity = 0.5
    document.getElementById("lighthouseForm").style.pointerEvents = "none"
  }

  function enableForm() {
    document.getElementById("lighthouseForm").style.opacity = 1
    document.getElementById("lighthouseForm").style.pointerEvents = "auto"
  }

  async function checkSession() {
    const { data } = await supabase.auth.getSession()

    if (data.session) {
      enableForm()
    } else {
      disableForm()
    }
  }

  checkSession()

})
</script>

    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 0rem;
            margin: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            display: flex;

        }

        label {
            font-size: 1rem;
            margin-bottom: 0.2rem;
            margin-top: 0.5rem;
            color: #555;
        }

        input,
        textarea,
        select {
            padding: 0.5rem;

            font-size: 1rem;
            border: solid;

        textarea {

        .section {

        .submission-form-title {

            margin-bottom: 0rem;

        button {

        }

# Keeps the free-tier Supabase project from auto-pausing after ~7 days
# of low database activity. Needs a real authenticated REST query (not 401).
#
# Uses the publishable key on the apikey header only — do not put
# sb_publishable_… in Authorization: Bearer (it is not a JWT).

name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ogningqqgxhwkmozikmu.supabase.co
          # Same publishable key as js/supabaseClient.js (public; RLS is the boundary)
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Q9SEFHhKlsG05lL4dmrSqw_hwbvmEAB
        run: |
          code=$(curl -sS -o /tmp/keepalive.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/lighthouses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json")
          echo "HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "Keep-alive failed; expected 2xx" >&2
            cat /tmp/keepalive.json >&2 || true
            exit 1
          fi

<!DOCTYPE html>
<!-- Browse shell (Recent sightings). Entry: /js/main.js. Styles: /css/main.css.
     Shared header / filter panel / footer chunks live in /partials/ and are
     rendered in place by `npm run build:html` (see /tools/build-html.mjs). -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent | Anime Lighthouse Index</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">

    <header>
      <h1>Anime Lighthouse Index</h1>

      <!-- include: partials/browse-subtitle.html -->
      <div class="subtitle-bar">
        <div class="subtitle">
          <span id="view-recent" class="view-link"><a class="view-anchor" href="/">Recent</a></span>
          •
          <span id="view-index" class="view-link"><a class="view-anchor" href="/list">List</a></span>
        </div>

        <button id="menu-toggle" class="burger">☰</button>
      </div>
      <!-- /include -->

      <!-- include: partials/browse-filter-panel.html -->
      <!-- hidden panel -->
      <div id="filter-panel" class="filter-panel hidden">

        <!-- Search -->
        <div class="panel-section">
          <input type="text" id="search" class="search-input" placeholder="Search..." />
        </div>

        <!-- Filters  -->
        <div class="panel-section">
          <div class="panel-header">Filters</div>

          <!-- Media type -->
          <label class="control">
            <div class="checkbox-group">
              <label class="checkbox">
                <input type="checkbox" id="filter-anime" checked />
                <span>Anime</span>
              </label>

              <label class="checkbox">
                <input type="checkbox" id="filter-manga" checked />
                <span>Manga</span>
              </label>
            </div>
          </label>

          <!-- Real only -->
          <label class="checkbox">
            <input type="checkbox" id="real-only" />
            <span>Real lighthouses only</span>
          </label>

          <label class="control">
            <span class="filter-dropdown-label">Lighthouse</span>
            <select id="lighthouse-filter">
              <option value="">All lighthouses</option>
            </select>
          </label>

          <label class="control">
            <span class="filter-dropdown-label">Sort order</span>
            <select id="sort-mode">
              <option value="newest">Most recent first</option>
              <option value="oldest">Oldest first</option>
              <option value="az">A–Z</option>
              <option value="za">Z–A</option>
            </select>
          </label>
        </div>

        <div class="filter-panel-footer">
          <span id="filter-result-count" class="filter-result-count" aria-live="polite"></span>
          <button type="button" id="filter-reset" class="filter-reset">Reset</button>
        </div>
      </div>
      <!-- /include -->

    </header>

    <main id="app"></main>

  </div>

  <footer class="site-footer" aria-label="Site preferences">
    <div class="container site-footer-inner">
      <div class="site-footer-controls">
        <!-- include: partials/footer-theme-row.html -->
        <div class="site-footer-theme-row">
          <span class="site-footer-label" id="light-theme-label">Light theme</span>
          <button
            type="button"
            id="theme-light-toggle"
            class="theme-switch-btn"
            role="switch"
            aria-checked="false"
            aria-labelledby="light-theme-label">
            <span class="theme-switch-track" aria-hidden="true">
              <span class="theme-switch-thumb"></span>
            </span>
          </button>
        </div>
        <!-- /include -->
        <label class="site-footer-title-lang">
          <span class="site-footer-label">Titles</span>
          <select id="title-mode" class="site-footer-select">
            <option value="title_en">English</option>
            <option value="title_r">Romaji</option>
            <option value="title_jp">日本語</option>
          </select>
        </label>
        <label class="site-footer-title-lang">
          <span class="site-footer-label">PAGE NAV</span>
          <select id="nav-position" class="site-footer-select">
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="both">Both</option>
          </select>
        </label>
      </div>
      <!-- include: partials/footer-links.html -->
      <div class="site-footer-links-wrap">
        <nav class="site-footer-links" aria-label="Site links">
          <a href="/">Home</a>
          <a href="/about">About</a>
        </nav>
      </div>
      <!-- /include -->
    </div>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>

</html>

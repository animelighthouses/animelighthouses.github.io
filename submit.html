<!DOCTYPE html>
<!-- Submit a sighting. Entry: /js/pages/submit/sighting.js -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit a sighting</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/submit.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/pica@9.0.1/dist/pica.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Submit</h1>
            <!-- include: partials/submit-subtitle.html -->
            <div class="subtitle-bar">
              <div class="subtitle">
                <span id="view-sighting" class="view-link"><a class="view-anchor" href="/submit">Sighting</a></span>
                •
                <span id="view-lighthouse" class="view-link"><a class="view-anchor" href="/submitl">Lighthouse</a></span>
                |
                <span class="view-link"><a class="view-anchor" href="/">Home</a></span>
              </div>

              <button id="loginBtn">Login</button>
            </div>
            <p id="submitAdminNotice" class="submit-auth-notice" hidden>
              Only administrators may submit. Please sign in with an authorized account to continue.
            </p>
            <!-- /include -->
            <form id="lighthouseForm">

                <div class="section">
                    <div class="field">
                        <label>Date spotted *</label>
                        <input name="date_spotted" type="date" required />
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <div class="label-row">
                            <label>Image</label>
                            <div class="label-toggle" role="group" aria-label="Image source">
                                <button type="button" id="imageSourceUploadBtn" class="label-toggle-btn is-active">Upload</button>
                                <button type="button" id="imageSourceUrlBtn" class="label-toggle-btn">URL</button>
                            </div>
                        </div>
                        <img id="imagePreview" class="image-preview" alt="Selected image preview" hidden />
                        <div id="imageUploadRow" class="image-input-row">
                            <input
                                name="image_file"
                                id="imageFileInput"
                                type="file"
                                accept="image/jpeg,image/png,image/webp"
                            />
                            <button type="button" id="traceMoeFetchBtn" disabled>trace.moe</button>
                        </div>
                        <div id="imageUrlRow" class="anilist-row" hidden>
                            <input id="imageUrlInput" type="url" inputmode="url" placeholder="https://…" />
                            <button type="button" id="traceMoeFetchBtnUrl" disabled>trace.moe</button>
                        </div>
                        <div id="traceMoeMatch" class="trace-match" hidden>
                            <img id="traceMoeThumb" alt="trace.moe matched frame" />
                            <div id="traceMoeMeta" class="trace-meta"></div>
                        </div>
                        <div class="trace-row">
                            <span id="traceMoeStatus" class="trace-status" aria-live="polite"></span>
                            <button type="button" id="traceMoeInsertBtn" hidden>Insert</button>
                            <button type="button" id="traceMoeClearBtn" hidden>Clear</button>
                        </div>
                    </div>

                    <div class="field">
                        <div class="anilist-row">
                            <input id="sauceNaoApiKeyInput" autocomplete="off" spellcheck="false" placeholder="SauceNAO API key" />
                            <button type="button" id="sauceNaoFetchBtn" disabled>SauceNAO</button>
                        </div>
                        <div id="sauceNaoMatch" class="trace-match" hidden>
                            <img id="sauceNaoThumb" alt="SauceNAO matched frame" />
                            <div id="sauceNaoMeta" class="trace-meta"></div>
                        </div>
                        <div class="trace-row">
                            <span id="sauceNaoStatus" class="trace-status" aria-live="polite"></span>
                            <button type="button" id="sauceNaoInsertBtn" hidden>Insert</button>
                            <button type="button" id="sauceNaoClearBtn" hidden>Clear</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>AniList link</label>

                        <div class="anilist-row">
                            <input name="anilist_link" id="anilistInput" type="url" />
                            <button type="button" id="anilistFetchBtn">Fetch</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>English title</label>
                        <input name="title_en" required />
                    </div>

                    <div class="field">
                        <label>Romaji title</label>
                        <input name="title_r" required />
                    </div>

                    <div class="field">
                        <label>Japanese title</label>
                        <input name="title_jp" />
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>Episode</label>
                        <input name="episode" />
                    </div>

                    <div class="field">
                        <label>Timestamp</label>
                        <input name="timestamp" />
                    </div>
                </div>

                <div class="section">
                    <div class="field checkbox-field">
                        <label>
                            <input type="checkbox" id="isReal">
                            Real?
                        </label>
                    </div>
                </div>

                <div id="lighthouseSection">
                    <div class="field">
                        <label>Lighthouse</label>
                        <select name="lighthouse_id" id="lighthouseSelect">
                            <option value="">-- Select lighthouse --</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label>Notes</label>
                        <div class="field">
                            <textarea name="notes"></textarea>
                        </div>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit">Add Sighting</button>
                </div>

                <div id="result" class="result"></div>

            </form>
    </div>
    <script type="module" src="/js/pages/submit/sighting.js"></script>
</body>

</html>

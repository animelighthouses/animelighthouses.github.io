<!DOCTYPE html>
<!-- Public sighting submission. Entry: /js/pages/public-submit.js -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit | Anime Lighthouse Index</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/submit.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Anime Lighthouse Index</h1>
            <!-- include: partials/public-submit-subtitle.html -->
            <div class="subtitle-bar">
              <div class="subtitle">
                <span class="view-link"><a class="view-anchor" href="/">Home</a></span>
              </div>
            </div>
            <!-- /include -->
            <p class="hint">Submit a lighthouse spotted in an anime or manga. Submissions are reviewed before appearing on the site.</p>

            <form id="publicSubmitForm" novalidate>
                <div class="section honeypot-field" aria-hidden="true">
                    <label for="company_website">Company website</label>
                    <input id="company_website" name="company_website" type="text" tabindex="-1" autocomplete="off" />
                </div>

                <div class="section">
                    <div class="field">
                        <label for="image_url">Image URL</label>
                        <input
                            id="image_url"
                            name="image_url"
                            type="text"
                            inputmode="url"
                            placeholder="E.g. https://i.imgur.com/..."
                        />
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label for="anilist_link">AniList media URL</label>
                        <input
                            id="anilist_link"
                            name="anilist_link"
                            type="text"
                            inputmode="url"
                            placeholder="E.g. https://anilist.co/anime/104459/"
                        />
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label for="notes">Notes (optional)</label>
                        <textarea
                            id="notes"
                            name="notes"
                            rows="4"
                            placeholder="Please provide any additional details, e.g. episode number, timestamp, lighthouse name or location, additional image links, etc."
                        ></textarea>
                    </div>
                </div>

                <div class="section">
                    <div class="field">
                        <label for="username">Your username (optional)</label>
                        <input id="username" name="username" type="text" maxlength="80" autocomplete="nickname" />
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" id="submitBtn">Send submission</button>
                </div>

                <div id="result" class="result"></div>
            </form>
        </header>
    </div>

    <footer class="site-footer" aria-label="Site preferences">
        <div class="container site-footer-inner">
            <div class="site-footer-controls">
                <!-- include: partials/footer-theme-row.html -->
                <div class="site-footer-theme-row">
                  <span class="site-footer-label" id="light-theme-label">Light theme</span>
                  <button
                    type="button"
                    id="theme-light-toggle"
                    class="theme-switch-btn"
                    role="switch"
                    aria-checked="false"
                    aria-labelledby="light-theme-label">
                    <span class="theme-switch-track" aria-hidden="true">
                      <span class="theme-switch-thumb"></span>
                    </span>
                  </button>
                </div>
                <!-- /include -->
                <span class="site-footer-title-lang site-footer-spacer" aria-hidden="true"></span>
            </div>
            <!-- include: partials/footer-links.html -->
            <div class="site-footer-links-wrap">
              <nav class="site-footer-links" aria-label="Site links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/submit">Submit</a>
                <a href="/admin">Admin</a>
              </nav>
            </div>
            <!-- /include -->
        </div>
    </footer>

    <script type="module" src="/js/pages/public-submit.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload | Anime Lighthouse Index</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/submit.css" />
  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">
    <header>
      <h1>Image Upload</h1>
      <div class="subtitle-bar">
        <div class="subtitle">
          <span class="view-link"><a class="view-anchor" href="/admin">Admin</a></span>
          |
          <span class="view-link"><a class="view-anchor" href="/">Home</a></span>
        </div>

        <button id="loginBtn">Login</button>
      </div>
      <p id="submitAdminNotice" class="submit-auth-notice" hidden>
        Only administrators may use this tool. Please sign in with an authorized account to continue.
      </p>
    </header>

    <section class="card">
      <form id="upload-form" class="upload-form">
        <label class="field">
          <span>Image file</span>
          <input id="file-input" name="file" type="file" accept="image/gif,image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" required />
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Resize</span>
            <select id="resize-select" name="resize">
              <option value="original">Original size</option>
              <optgroup label="Anime">
                <option value="1920">1080p</option>
                <option value="1280">720p</option>
                <option value="640">480p</option>
              </optgroup>
              <optgroup label="Manga">
                <option value="2000">2000px</option>
                <option value="1600">1600px</option>
                <option value="1000">1000px</option>
              </optgroup>
            </select>
          </label>

          <label class="field">
            <span>Output</span>
            <select id="format-select" name="format">
              <option value="original">Original format</option>
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
            </select>
          </label>
        </div>

        <div id="quality-field" class="field hidden">
          <span>Quality</span>
          <div class="quality-row">
            <input id="quality-slider" type="range" min="1" max="100" step="1" value="90" aria-label="Quality" />
            <input id="quality-input" name="quality" type="number" min="1" max="100" step="1" value="90" aria-label="Quality percent" />
          </div>
        </div>

        <label class="field">
          <span>Upload token</span>
          <input id="token-input" name="token" placeholder="Bearer token" required />
        </label>

        <div class="preview-shell">
          <img id="preview-image" class="preview-image hidden" alt="Selected file preview" />
          <p id="preview-empty" class="helper-text">No file selected yet.</p>
        </div>

        <div class="button-row">
          <button id="preview-button" type="button">Preview</button>
          <button id="upload-button" type="submit">Upload image</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Status</h2>
      <div id="status-box" class="status-box" aria-live="polite">Choose a file to begin.</div>
    </section>

    <section class="card">
      <h2>Result</h2>

      <label class="field">
        <span>Image URL</span>
        <div class="copy-row">
          <input id="result-url" type="text" readonly placeholder="Upload result URL" />
          <button type="button" data-copy-target="result-url">Copy</button>
        </div>
      </label>

      <label class="field">
        <span>Markdown</span>
        <div class="copy-row">
          <textarea id="result-markdown" rows="3" readonly placeholder="Markdown image snippet"></textarea>
          <button type="button" data-copy-target="result-markdown">Copy</button>
        </div>
      </label>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>

</html>
